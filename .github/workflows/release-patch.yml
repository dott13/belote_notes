name: Release - Bug Fix Version

# Manual: publishes the current version as a signed Android release APK and
# GitHub Release, without bumping it further - the patch version is already
# advanced continuously by auto-version-bump.yml on every push to main, so
# this just tags and ships whatever that version currently is.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_build-release-android.yml
    with:
      bump_type: none
    secrets: inherit
